/* Playai design tokens.
   Every colour, radius and type size in the app comes from here.
   If you are about to write a hex value in a component, stop.

   Names match mockup.html, docs/DESIGN.md and docs/SCREENS.md exactly. They were
   spelled differently here once and it is the kind of drift that costs an afternoon:
   three artefacts agreed, this file did not. */

:root {
  /* Surfaces */
  --pg: #ffffff;           /* page */
  --bg2: #f7f6f3;          /* inset areas, disabled tiles, progress track */

  /* Ink — warm near-black, never #000 */
  --ink: #37352f;          /* primary text, primary button fill, drawn strokes */
  --ink2: #787774;         /* secondary text */
  --ink3: #9b9a97;         /* captions, disabled */
  --on-ink: #ffffff;       /* text on an ink fill */

  /* Rules */
  --ln: #edece9;           /* hairline dividers, 1px, horizontal only */
  --ln2: #dfdeda;          /* dashed placeholders, dead-state outlines */
  --border: 1.5px solid var(--ink); /* interactive borders */

  /* Colour appears in exactly two places: an avatar tile, and a highlighter.
     Eight tiles because a room holds eight players and the tile is the player's
     identity — it has to stay distinct in a list of eight. */
  --mark: #fbf3db;         /* highlighter behind text */
  --tYel: #fbf3db;         /* avatar tiles — assign per player, keep stable */
  --tRed: #fbe4e4;
  --tBlu: #ddebf1;
  --tGrn: #ddedea;
  --tPur: #eae4f2;
  --tOrg: #faebdd;
  --tPnk: #f4dfeb;
  --tGry: #f1f0ee;

  /* Radius — nothing above 6px */
  --r-control: 4px;
  --r-tile: 6px;

  /* Type */
  --font: "Inter", system-ui, -apple-system, sans-serif;
  --fs-hero: 46px;
  --fs-title: 26px;
  --fs-display: 84px;      /* target time */
  --fs-count: 110px;       /* countdown digit */
  --fs-body: 16px;
  --fs-row: 15px;
  --fs-caption: 12px;

  --fw-regular: 400;
  --fw-medium: 500;
  --fw-semibold: 600;

  /* Spacing */
  --pad-screen: 24px;
  --pad-top: 46px;         /* plus safe-area inset */
  --pad-bottom: 30px;
  --row-gap: 7px;
}

/* Every number in this app lives in a column. Without this, results jitter. */
.num,
[data-numeric] {
  font-variant-numeric: tabular-nums;
}

function header(middle='',left='back',right='help'){return `<header class="header"><div>${left?`<button data-action="${left}" aria-label="${t(left==='menu'?'options':left==='chooseGame'?'backGames':left)}" title="${t(left==='menu'?'options':left==='chooseGame'?'backGames':left)}">${left==='chooseGame'?navIcon('back')+t('gamesNav'):navIcon(left)}</button>`:''}</div><div class="middle">${middle}</div><div class="right">${right?`<button data-action="${right}" aria-label="${t(right==='menu'?'options':right)}" title="${t(right==='menu'?'options':right)}">${navIcon(right)}</button>`:''}</div></header>`}
function footer(primary='',secondary='',meta=''){return `<footer class="actions"><div class="action-meta" id="footer-meta" role="status">${meta}</div><div class="action-row ${secondary?'two':''}">${secondary}${primary||'<div class="action-placeholder primary-slot hidden" aria-hidden="true">—</div>'}</div></footer>`}
function status(key,v={}){return `<div class="action-placeholder primary-slot" role="status">${t(key,v)}</div>`}
function shell(head,body,foot,cls=''){return `<div class="shell ${cls}" data-size="${seen().length}" style="--seen-count:${seen().length}">${head}<section class="body">${body}</section>${foot}</div>`}
function stopTimers(){epoch++;jobs.forEach(clearTimeout);jobs=[];clearInterval(ticker);ticker=null}
function schedule(fn,ms){const id=epoch;jobs.push(setTimeout(()=>{if(id===epoch)fn()},Math.max(0,ms)))}
function screen(name,{keepTimers=false}={}){if(reminderOpen)dismiss();if(!keepTimers)stopTimers();if(dialog.open)dialog.close();if((name==='final'||name==='summary')&&name!==S.screen)S.resetList=true;S.screen=name;render();const target=app.querySelector('h1,h2,.middle');target?.setAttribute('tabindex','-1');target?.focus({preventScroll:true});}
function rank(list,metric,p){return 1+list.filter(x=>metric(x)<metric(p)-1e-8).length}
function roundWinners(){const valid=S.results.filter(x=>x.error!==null);if(!valid.length)return [];const min=Math.min(...valid.map(x=>Math.abs(x.error)));return valid.filter(x=>Math.abs(Math.abs(x.error)-min)<1e-8).map(x=>people[x.id])}
function winners(list,metric,descending=false){if(!list.length)return [];const scores=list.map(metric),best=descending?Math.max(...scores):Math.min(...scores);return list.filter(p=>Math.abs(metric(p)-best)<1e-8)}
function winnersText(list,round=false){return list.length===0?t('noWinner'):list.length===1?t(round?'winnerRound':'wins',{name:list[0].name}):t(round?'tieRound':'tieWins',{n:list.length})}
function role(p){return p.id===S.me?(p.id===S.host?t('youHost'):t('you')):p.id===S.host?t('host'):p.active?'':t('left')}
function roster(mode){const finalMode=mode==='final'||mode==='summary';const list=finalMode?[...seen()].sort((a,b)=>mode==='summary'?b.total-a.total||a.id-b.id:Number(b.active)-Number(a.active)||gameMetric(a)-gameMetric(b)||a.id-b.id):seen();const heading={lobby:['status','points'],waiting:['status','place'],roundResult:['timing','place'],overall:['average','place'],final:['average','points'],summary:['total','place']}[mode];return `<div class="roster" data-size="${list.length}"><div class="table-head"><span class="people-label">${t('allPlayers',{n:list.length})}</span><span class="value">${mode==='lobby'?'':t(heading[0])}</span><span class="position">${['lobby','waiting'].includes(mode)?'':t(heading[1])}</span></div><div class="roster-scroll" id="roster-scroll" tabindex="0" role="region" aria-label="${t('players')}">${list.map(p=>{const f=playerFields(p,mode);const position=mode==='final'?(p.active?place(p):null):mode==='summary'?1+seen().filter(x=>x.total>p.total).length:null;return `<div class="player ${p.id===S.me?'self':''} ${p.active?'':'absent'} ${finalMode&&position===1?'top-ranked':''}" data-player-slot="${p.id}">${avatar(p)}<div class="identity"><div class="name"><span>${esc(p.name)}</span></div><span class="role">${mode==='final'&&position!==null?'#'+position+(role(p)?' · ':''):''}${role(p)}${['overall','final'].includes(mode)&&misses(p)?' · '+completed(p)+'/'+p.history.length+' taps':''}</span></div><div class="value ${f.quiet?'quiet':''}" ${f.aria?`aria-label="${esc(f.aria)}"`:''}>${f.value}</div><div class="position">${f.position}</div></div>`}).join('')}</div></div>`}
function intro(){return shell(header(t('platform'),'',''),`<div class="center-body"><div class="landing-text"><h1>${t('platformTitle')}</h1><p>${t('platformIntro')}</p><p class="muted">${t('platformBody')}</p></div></div>`,footer(button('create','create'),button('joinShort','join','secondary')))}
function form(){const join=S.mode==='join',prefill=S.screen==='qrjoin';const chosen={face:S.face,tile:colors[S.me]};return shell(header(t('platform'),'back',''),`<form id="identity-form" class="form-body" novalidate><h2>${t(join?'joinTitle':'createTitle')}</h2><p class="meta center">${t('roomIdentity')}</p>${join?(prefill?`<div class="notice">${t('qrReady',{code:S.code})}</div><input type="hidden" name="code" value="${S.code}">`:`<div class="field"><label for="code">${t('code')}</label><input name="code" id="code" class="code-input" value="${esc(S.draftCode)}" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-describedby="code-help"><p class="help" id="code-help">${t('codeHelp')}</p></div>`):''}<div class="field"><label for="name">${t('name')}</label><input name="name" id="name" maxlength="12" autocomplete="nickname" value="${esc(S.name)}" placeholder="${t('namePlaceholder')}" aria-describedby="form-error"></div><div class="face-choice"><span class="face-label">${t('face')}</span><div class="face-preview">${avatar(chosen)}${button('changeFace','faces','quiet')}</div></div><p class="error" id="form-error" role="alert"></p></form>`,footer(`<button type="submit" class="button primary" form="identity-form">${t(join?'joinAction':'create')}</button>`))}
function lobby(){const host=S.me===S.host;return shell(header(t('title'),'chooseGame','menu'),`<div class="preparation"><div class="preparation-settings">${host?`<button class="settings-summary" data-action="setup" aria-label="${t('editSettings')}"><span>${t('gameSettings')}</span><strong>${t(S.pace==='auto'?'settingsAuto':'settingsManual',{n:S.rounds})}</strong>${navIcon('back')}</button>`:`<p class="meta">${t(S.pace==='auto'?'settingsAuto':'settingsManual',{n:S.rounds})}</p>`}</div></div>${roster('lobby')}`,footer(host?button(active().length>=2?'startGame':'needPlayer','start','primary',active().length<2?'disabled':''):status('prepWaiting',{name:people[S.host].name})),'preparation-shell')}
const GAME_CATALOGUE=[
  {id:'blindstop',name:'title',description:'gameDescription',range:'gameRange',mark:()=>ico('sw','watch')},
  {id:'impostor',name:'impostorTitle',description:'impostorDescription',range:'impostorRange',mark:()=>'<span class="impostor-mark" aria-hidden="true">?</span>'},
  {id:'categories',name:'categoriesTitle',description:'categoriesDescription',range:'categoriesRange',mark:()=>'<span class="categories-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>'}
];
function catalogue(){const host=S.me===S.host;const games=GAME_CATALOGUE.map(game=>`<button class="game-entry" data-action="selectGame" data-id="${game.id}">${game.mark()}<span><strong>${t(game.name)}</strong><span>${t(game.description)}</span><small>${t(game.range)}</small></span>${navIcon('back')}</button>`).join('');return shell(header(t('platform'),'','menu'),`<div class="catalogue"><div class="catalogue-context"><p class="meta room-context">${t('roomContext',{code:S.code,n:active().length})}</p><button class="text-action" data-action="invite">${t('inviteFriends')}</button></div><h1>${t('chooseGame')}</h1>${host?`<div class="game-list">${games}</div>`:`<p class="waiting-selection" role="status">${t('pickWaiting',{name:people[S.host].name})}</p>`}</div>`,'','catalogue-shell')}
function prepareGame(id='blindstop'){if(S.me!==S.host||!['catalogue','final','impostorResult','categoriesResult','lobby'].includes(S.screen))return;const game=GAME_CATALOGUE.find(item=>item.id===id);if(!game)return;S.gameId=game.id;S.impostor=null;S.categories=null;S.live=false;S.resetList=true;screen(game.id==='blindstop'?'lobby':game.id==='impostor'?'impostorPrepare':'categoriesPrepare')}
function impostorPrepare(){const host=S.me===S.host,enough=active().length>=3;return shell(header(t('impostorTitle'),'chooseGame','menu'),`<div class="preparation"><h1>${t('impostorTitle')}</h1><p>${t('impostorDescription')}</p><p class="meta">${t('impostorPrepare')}</p></div>${roster('lobby')}`,footer(host?button(enough?'impostorStart':'impostorNeed','impostorStart','primary',enough?'':'disabled'):status('prepWaiting',{name:people[S.host].name})),'preparation-shell')}
function startImpostor(hostInitiated=false){if(S.screen!=='impostorPrepare'||active().length<3||(!hostInitiated&&S.me!==S.host))return;S.impostor={impostorId:active().find(p=>p.id!==S.me).id,revealed:false,vote:null,votes:[],previewRole:null,speakerIds:active().map(p=>p.id),speakerIndex:0};S.live=false;screen('impostorRole')}
function impostorRole(){const shown=S.impostor?.revealed,roleView=S.impostor?.previewRole||(S.impostor?.impostorId===S.me?'impostor':'ordinary'),impostor=roleView==='impostor';const inside=shown?(impostor?`<p class="meta">${t('impostorRole')}</p><h2>${t('impostorHint')}</h2>`:`<p class="meta">${t('ordinaryRole')}</p><h2><span class="secret-word">${t('secretWord')}</span></h2><p>${t('ordinaryHint')}</p>`):`<h2>${t('roleReady')}</h2><p class="meta">${t('rolePrivacy')}</p>`;return shell(header(t('impostorTitle'),'','menu'),`<div class="secret-panel">${inside}</div>`,footer(button(shown?'hideRole':'revealRole',shown?'hideRole':'revealRole')))}
function impostorClues(){const ids=S.impostor.speakerIds,index=S.impostor.speakerIndex,p=people[ids[index]],can=S.me===S.host||S.me===p.id,last=index===ids.length-1;return shell(header(t('clueTitle'),'','menu'),'<div class="center-body discussion-copy">'+avatar(p)+'<h2>'+t(p.id===S.me?'clueTurn':'clueSpeaker',{name:p.name})+'</h2><p>'+t('clueInstruction')+'</p><p class="meta">'+t('clueProgress',{n:index+1,total:ids.length})+'</p></div>',footer(can?button(last?'clueLast':p.id===S.me?'clueDone':'clueNext','nextClue'):status('clueWait',{name:p.name}),button('roleReminder','roleReminder','secondary')))}
function advanceClue(preview=false){if(S.screen!=='impostorClues'||(!preview&&S.me!==S.host&&S.me!==S.impostor.speakerIds[S.impostor.speakerIndex]))return;S.impostor.speakerIndex++;screen(S.impostor.speakerIndex>=S.impostor.speakerIds.length?'impostorDiscussion':'impostorClues')}
let reminderOpen=false;
function showRoleReminder(){if(!['impostorClues','impostorDiscussion'].includes(S.screen))return;if(dialog.open)dismiss();reminderOpen=true;openDialog(t('roleReminder'),'<p>'+t('rolePrivacy')+'</p>',button('revealRole','revealReminder')+button('hideReminder','dismiss','secondary'))}
function revealReminder(){if(!reminderOpen||!dialog.open||!['impostorClues','impostorDiscussion'].includes(S.screen))return;const imp=S.impostor.impostorId===S.me;dismiss();reminderOpen=true;openDialog(t('roleReminder'),'<p>'+t(imp?'impostorRole':'ordinaryRole')+'</p>'+(imp?'<p>'+t('impostorHint')+'</p>':'<h2>'+t('secretWord')+'</h2><p>'+t('ordinaryHint')+'</p>'),button('hideReminder','dismiss'));}
function impostorDiscussion(){const host=S.me===S.host;return shell(header(t('discussion'),'','menu'),`<div class="center-body discussion-copy"><h2>${t('discussion')}</h2><p>${t('discussionBody')}</p></div>`,footer(host?button('openVote','openVote'):status('impostorHostWait',{name:people[S.host].name}),button('roleReminder','roleReminder','secondary'),t('discussionReady')))}
function impostorVote(){const choices=active().filter(p=>p.id!==S.me).map(p=>`<button class="candidate" data-action="chooseSuspect" data-id="${p.id}" aria-pressed="${S.impostor.vote===p.id}">${avatar(p)}<span>${esc(p.name)}</span><span class="choice-mark">${ico('t')}</span></button>`).join('');return shell(header(t('voting'),'','menu'),`<div class="preparation"><h1>${t('votePrompt')}</h1><p class="meta">${t('voteHelp')}</p></div><div class="candidate-list">${choices}</div>`,footer(button('confirmVote','confirmVote','primary',S.impostor.vote===null?'disabled':'')))}
function castImpostorVote(){if(S.screen!=='impostorVote')return;const chosen=S.impostor.vote;if(chosen===null||chosen===S.me)return;S.impostor.votes=[{voter:S.me,target:chosen}];S.impostor.revealed=false;screen('impostorWaiting')}
function finishImpostorPreview(){if(S.screen!=='impostorWaiting')return;const chosen=S.impostor.vote,imp=S.impostor.impostorId,other=active().find(p=>p.id!==imp)?.id;S.impostor.votes=active().map(p=>({voter:p.id,target:p.id===S.me?chosen:p.id===imp?other:imp}));S.screen='impostorResult';S.live=false;dismiss();render()}
function impostorWaiting(){return shell(header(t('impostorTitle'),'','menu'),`<div class="center-body"><h2>${t('voteWaiting')}</h2><p>${t('voteWaitingBody')}</p><p class="meta" role="status">${t('votesReceived',{n:S.impostor.votes.length,total:S.impostor.speakerIds.length})}</p></div>`,footer(button('previewOptions','impostorPreview','secondary')))}
function impostorOutcome(){const counts=new Map(active().map(p=>[p.id,0]));for(const vote of S.impostor.votes)counts.set(vote.target,(counts.get(vote.target)||0)+1);const max=Math.max(...counts.values()),leaders=active().filter(p=>counts.get(p.id)===max),eliminated=leaders.length===1?leaders[0]:null;return {counts,leaders,eliminated,caught:eliminated?.id===S.impostor.impostorId}}
function impostorResult(){const result=impostorOutcome(),imp=people[S.impostor.impostorId];const rows=[...active()].sort((a,b)=>result.counts.get(b.id)-result.counts.get(a.id)||a.id-b.id).map(p=>`<div class="vote-line">${avatar(p)}<span>${esc(p.name)}</span><span class="vote-count">${t(result.counts.get(p.id)===1?'oneVote':'voteCount',{n:result.counts.get(p.id)})}</span></div>`).join('');return shell(header(t('impostorResult'),'','menu'),`<div class="focal impostor-result"><h2>${t(result.caught?'ordinaryWin':'impostorWin')}</h2><p>${t(result.eliminated?'eliminated':'voteTied',result.eliminated?{name:result.eliminated.name}:{})}</p>${result.eliminated?'':`<p>${t('noElimination')}</p>`}<p class="message">${t(result.caught?'impostorCaught':'impostorEscaped')}</p><p class="meta">${t('wasImpostor',{name:imp.name})}</p><p>${t('secretWordLabel')}: <strong>${t('secretWord')}</strong></p></div><div>${rows}</div>`,footer(S.me===S.host?button('playImpostorAgain','replayImpostor'):status('hostDecision',{name:people[S.host].name}),S.me===S.host?button('anotherGame','lobby','secondary'):'',t('impostorNoPoints')))}
const CATEGORY_KEYS=['categoryCountry','categoryCity','categoryAnimal','categoryFood'];
function emptyCategoryAnswers(){return ['', '', '', '']}
function categoriesPrepare(){const host=S.me===S.host,enough=active().length>=2;return shell(header(t('categoriesTitle'),'chooseGame','menu'),`<div class="preparation"><h1>${t('categoriesTitle')}</h1><p>${t('categoriesDescription')}</p><p class="meta">${t('categoriesPrepare')}</p></div>${roster('lobby')}`,footer(host?button(enough?'categoriesStart':'categoriesNeed','categoriesStart','primary',enough?'':'disabled'):status('prepWaiting',{name:people[S.host].name})),'preparation-shell')}
function startCategories(preview=false){if(S.screen!=='categoriesPrepare'||active().length<2||(!preview&&S.me!==S.host))return;const samples=[['Brazil','Berlin','Bear','Bread'],['Belgium','Boston','Bear','Bagel'],['Bolivia','Bristol','Badger','Brownie'],['France','Bergen','','Banana']];S.categories={letter:'B',draft:emptyCategoryAnswers(),otherDrafts:Object.fromEntries(active().filter(p=>p.id!==S.me).map((p,i)=>[p.id,[...samples[i%samples.length]]])),answers:{},reviewIndex:0,judgments:{},scores:null};S.live=false;screen('categoriesWrite')}
function categoriesWrite(){const c=S.categories,ready=c.draft.every(x=>x.trim());const fields=CATEGORY_KEYS.map((key,i)=>`<div class="field"><label for="category-${i}">${t(key)}</label><input id="category-${i}" data-category-index="${i}" value="${esc(c.draft[i])}" placeholder="${t('categoryPlaceholder')}" autocomplete="off" maxlength="40"></div>`).join('');return shell(header(t('categoriesTitle'),'','menu'),`<div class="category-form"><div class="letter-line"><span>${t('categoriesLetter')}</span><strong>${esc(c.letter)}</strong></div><div class="category-fields">${fields}</div></div>`,footer(button('categoriesStop','categoriesStop','primary',ready?'':'disabled')),'category-write-shell')}
function lockCategoryAnswers(early=false){if(S.screen!=='categoriesWrite'||(early?S.me!==S.host:!S.categories.draft.every(value=>value.trim())))return;S.categories.answers=Object.fromEntries(Object.entries(S.categories.otherDrafts).map(([id,answers])=>[id,[...answers]]));S.categories.answers[S.me]=[...S.categories.draft];S.live=false;screen('categoriesWaiting')}
function categoriesWaiting(){const n=Object.keys(S.categories.answers).length;return shell(header(t('categoriesTitle'),'','menu'),`<div class="center-body">${ico('t','locked-mark')}<h2>${t('categoriesWaiting')}</h2><p>${t('categoriesWaitingBody')}</p><p class="meta">${t('categoriesSubmitted',{n,total:active().length})}</p></div>`,footer(button('categoriesPreviewAnswers','categoriesPreview','secondary')))}
function previewCategoryAnswers(){if(S.screen!=='categoriesWaiting')return;S.categories.reviewIndex=0;screen('categoriesReview')}
function categoryEligible(value){return value.trim().toLocaleLowerCase().startsWith(S.categories.letter.toLocaleLowerCase())}
function categoriesReview(){const host=S.me===S.host,i=S.categories.reviewIndex,key=CATEGORY_KEYS[i],rows=active().map(p=>{const answer=S.categories.answers[p.id]?.[i]||'',eligible=categoryEligible(answer),valid=eligible&&S.categories.judgments[`${i}:${p.id}`]!==false;return `<div class="review-row">${avatar(p)}<span class="review-answer"><strong>${answer?esc(answer):'—'}</strong><small>${esc(p.name)}</small></span><button class="judge" data-action="categoriesJudge" data-id="${p.id}" aria-pressed="${valid}" ${eligible&&host?'':`disabled title="${t('categoriesInvalid')}"`}>${t(valid?'categoriesValid':'categoriesInvalid')}</button></div>`}).join('');return shell(header(t('categoriesReview'),'','menu'),`<div class="preparation"><h1>${t('categoriesReview')}</h1><p class="meta">${t('categoriesReviewStep',{category:tr(key),n:i+1,total:CATEGORY_KEYS.length})}</p><p>${t('categoriesReviewHelp')}</p></div><div class="review-list">${rows}</div>`,footer(host?button('categoriesConfirmCategory','categoriesConfirm','primary','',{category:tr(key)}):button('previewOptions','categoriesPreviewReview','quiet')))}
function categoryScores(){const scores=Object.fromEntries(active().map(p=>[p.id,0]));CATEGORY_KEYS.forEach((_,i)=>{const valid=active().filter(p=>categoryEligible(S.categories.answers[p.id]?.[i]||'')&&S.categories.judgments[`${i}:${p.id}`]!==false);const counts=new Map();valid.forEach(p=>{const key=S.categories.answers[p.id][i].trim().toLocaleLowerCase();counts.set(key,(counts.get(key)||0)+1)});valid.forEach(p=>{const key=S.categories.answers[p.id][i].trim().toLocaleLowerCase();scores[p.id]+=counts.get(key)>1?5:10})});return scores}
function confirmCategory(){if(S.screen!=='categoriesReview'||S.me!==S.host)return;if(++S.categories.reviewIndex<CATEGORY_KEYS.length){screen('categoriesReview');return}S.categories.scores=categoryScores();S.live=false;screen('categoriesResult')}
function categoriesResult(){const rows=active().map(p=>`<div class="score-row">${avatar(p)}<span><strong>${esc(p.name)}</strong>${p.id===S.me?` <small>· ${t('you')}</small>`:''}</span><strong>${S.categories.scores[p.id]}</strong></div>`).join('');return shell(header(t('categoriesResults'),'','menu'),`<div class="focal"><h2>${t('categoriesRoundPoints')}</h2><p>${t('categoriesYourPoints',{n:S.categories.scores[S.me]})}</p><p class="meta">${t('categoriesPointsPending')}</p></div><div class="score-list">${rows}</div>`,footer(S.me===S.host?button('categoriesPlayAgain','replayCategories'):status('hostDecision',{name:people[S.host].name}),S.me===S.host?button('anotherGame','lobby','secondary'):'',t('categoriesRoundPoints')))}
function updatePreparation(){if(S.screen!=='lobby'||S.me!==S.host)return;const input=document.getElementById('prepare-rounds'),value=Number(input.value);if(!Number.isInteger(value)||value<1||value>20){input.setAttribute('aria-invalid','true');document.getElementById('prepare-error').textContent=tr('roundsInvalid');return false}S.rounds=value;input.setAttribute('aria-invalid','false');document.getElementById('prepare-error').textContent='';return true}
function timing(){const counting=S.screen==='countdown';return shell(header(roundLabel(),'','menu'),`<div class="timing"><div class="timing-content"><p class="meta">${t('target')}</p><p class="target">${S.target.toFixed(2)} <small>s</small></p><div class="count-holder ${counting?'':'silent'}" ${counting?'':'aria-hidden="true"'}><svg viewBox="0 0 200 200" aria-hidden="true"><use href="#ring"/></svg><span class="count-digit" id="count">${S.countdown}</span></div><p class="meta ${counting?'':'silent'}">${t('countStarts')}</p></div></div>`,footer(counting?button('getReady','none','primary','disabled'):button('tap','tap','primary tap','id="tap"'),'',counting?'':t('countSilently')))}

function makeTargets(count,rng=Math.random){const pool=[];for(let whole=3;whole<=11;whole++)for(let part=11;part<=89;part++){if(part%5!==0)pool.push(whole*100+part)}const result=[];for(let i=0;i<count;i++){const choices=pool.filter(x=>!result.length||Math.abs(x-result[result.length-1])>=80);const candidate=choices[Math.min(choices.length-1,Math.floor(rng()*choices.length))];result.push(candidate);pool.splice(pool.indexOf(candidate),1)}return result.map(x=>x/100)}

.setupDraft.rounds)?S.setupDraft.rounds:5)+Number(el.dataset.step));commitSetup();break;case 'roundPreset':readSetup();updateRoundChoice(Number(el.dataset.rounds));commitSetup();break;case 'draftPace':readSetup();S.setupDraft.pace=el.dataset.mode==='auto'?'auto':'manual';dialog.querySelectorAll('[data-action="draftPace"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===S.setupDraft.pace)));document.getElementById('pace-description').textContent=tr(S.setupDraft.pace==='manual'?'hostPaceDesc':'autoPaceDesc');break;case 'saveSetup':saveSetup();break;case 'home':screen('home');break;case 'back':if(S.screen==='paused'){action('leave',el);break}screen(['form','qrjoin','return','gone','full','playing'].includes(S.screen)?'home':'lobby');break;case 'create':resetRoom();S.mode='create';S.me=0;screen('form');break;case 'join':if(S.left){screen('return');break}S.mode='join';S.me=1;screen('form');break;case 'face':S.face=Number(el.dataset.id);render();document.querySelector(`[data-action="face"][data-id="${S.face}"]`)?.focus({preventScroll:true});break;case 'faces':facePicker();break;case 'pickFace':S.faceDraft=Number(el.dataset.id);dialog.querySelectorAll('[data-action="pickFace"]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.id)===S.faceDraft)));break;case 'saveFace':S.face=S.faceDraft;dismiss();render();app.querySelector('[data-action="faces"]')?.focus({preventScroll:true});break;case 'pace':pacePicker();break;case 'setPace':if(S.me!==S.host)break;S.pace=el.dataset.mode==='auto'?'auto':'manual';dialog.querySelectorAll('[data-action="setPace"]').forEach(b=>b.setAttribute('aria-checked',String(b.dataset.mode===S.pace)));const paceControl=app.querySelector('[data-action="pace"]');if(paceControl)paceControl.textContent=tr('paceButton',{mode:tr(S.pace==='manual'?'hostPace':'autoPace')});const footerMeta=document.getElementById('footer-meta');if(footerMeta)footerMeta.textContent=tr(S.pace==='manual'?'hostPaceShort':'autoPaceShort');break;case 'nextRound':advanceRound();break;case 'toggleAuto':if(S.screen!=='roundResult'||S.me!==S.host)break;S.resultPaused=!S.resultPaused;if(S.resultPaused)stopTimers();else startResultTimer();render();break;case 'start':if(S.screen==='lobby')offerStart();break;case 'tap':tap();break;case 'lobby':if(S.me===S.host){S.live=false;screen('catalogue')}break;case 'help':help();break;case 'invite':invite();break;case 'menu':menu();break;case 'dismiss':dismiss();break;case 'copy':toast(await copy(S.code)?'copied':'copyFail');break;case 'share':await share();break;case 'new':resetRoom();S.mode='create';S.me=0;screen('form');break;case 'rejoin':S.left=false;if(S.returnToGame){S.returnToGame=false;resumeGame()}else screen(['catalogue','final','lobby'].includes(S.returnScreen)?S.returnScreen:'catalogue');break;case 'resume':resumeGame();break;case 'endEvening':openDialog(t('endTitle'),`<p>${t('endBody')}</p>`,button('endConfirm','confirmEnd')+button('cancel','dismiss','secondary'));break;case 'confirmEnd':S.live=false;screen('summary');break;case 'stop':openDialog(t('stopTitle'),`<p>${t('stopBody')}</p>`,button('stop','confirmStop')+button('cancel','dismiss','secondary'));break;case 'confirmStop':S.live=false;screen('catalogue');break;case 'leave':openDialog(t('leaveTitle'),`<p>${t('leaveBody')}</p>`,button('leave','confirmLeave')+button('leaveOrStay','dismiss','secondary'));break;case 'confirmLeave':S.returnScreen=S.screen;S.returnToGame=S.live||S.screen==='paused';if(S.live)pauseGame(false);S.left=true;screen('return');break;case 'manage':manage();break;case 'remove':{const p=people[Number(el.dataset.id)];openDialog(t('removeTitle',{name:p.name}),`<p>${t('removeBody')}</p>`,button('remove','confirmRemove','primary',`data-id="${p.id}"`)+button('cancel','dismiss','secondary'));break}case 'confirmRemove':people[Number(el.dataset.id)].active=false;screen(S.screen==='catalogue'?'catalogue':'lobby');break;}}
S.practice=false;S.practiceDone=false;S.resultsView='roundResult';
function roundLabel(){return S.practice?t('practiceRound'):t('round',{n:S.round,total:S.gameRounds})}
function completed(p){return p.history.filter(r=>r.error!==null).length}
function misses(p){return p.history.length-completed(p)}
function mean(p){const h=p.history.filter(r=>r.error!==null);return h.length?Math.round(h.reduce((s,r)=>s+Math.abs(r.error),0)/h.length*100)/100:0}
function gameMetric(p){return misses(p)*1000+mean(p)}
function place(p){return rank(active(),gameMetric,p)}
function roundMetric(p){const r=S.results.find(x=>x.id===p.id);return r&&r.error!==null?Math.abs(r.error):Infinity}
function errorText(error){return error===null?t('missed'):error===0?'0.00 s':(error<0?'−':'+')+Math.abs(error).toFixed(2)+' s'}
function playerFields(p,mode){if(!p.active&&mode!=='summary')return {value:t('left'),position:'—',quiet:true};if(mode==='lobby')return {value:'',position:'',quiet:true};if(mode==='waiting'){const done=S.results.some(r=>r.id===p.id);return {value:done?ico('t'):t('counting'),position:'',aria:tr(done?'locked':'counting'),quiet:!done}}if(mode==='roundResult'){const r=S.results.find(x=>x.id===p.id);return {value:r?errorText(r.error):'—',position:r?'#'+rank(active(),roundMetric,p):'—'}}if(mode==='overall'||mode==='final')return {value:completed(p)?mean(p).toFixed(2)+' s':'—',position:mode==='overall'?'#'+place(p):'+'+(completed(p)?active().length-place(p)+1:0)};if(mode==='summary')return {value:p.total===1?t('pointUnit'):t('pointsUnit',{n:p.total}),position:'#'+(1+seen().filter(x=>x.total>p.total).length)};return {value:'—',position:'—'}}
function offerStart(){if(S.me!==S.host)return;if(S.games===0&&!S.practiceDone)openDialog(t('practiceTitle'),`<p>${t('practiceBody')}</p>`,button('practiceAction','practice')+button('skipPractice','realStart','secondary'));else startGame()}
function startPractice(){if(S.me!==S.host)return;S.practice=true;S.practiceDone=true;S.target=6.37;S.round=1;S.results=[];S.live=true;dismiss();startCountdown()}
function startGame(hostInitiated=false){if(active().length<2||active().length>20||(!hostInitiated&&S.me!==S.host))return;S.practice=false;S.practiceDone=true;S.resultsView='roundResult';people.forEach(p=>p.history=[]);S.gameRounds=S.rounds;S.gamePace=S.pace;S.targets=makeTargets(S.gameRounds);S.round=1;S.target=S.targets[0];S.results=[];S.scored=false;S.live=true;S.listScroll=0;if(dialog.open)dismiss();startCountdown()}
function insight(){const h=self().allHistory.filter(r=>r.error!==null);if(!h.length)return t('noRounds');const early=h.filter(r=>r.error<0).length,late=h.filter(r=>r.error>0).length;if(early>h.length/2)return t('earlyInsight',{n:early,total:h.length});if(late>h.length/2)return t('lateInsight',{n:late,total:h.length});return t('neutralInsight',{n:(h.reduce((s,r)=>s+Math.abs(r.error),0)/h.length).toFixed(2)})}
function completeRound(){if(S.screen==='roundResult')return;stopTimers();if(!S.practice)for(const p of active()){const r=S.results.find(x=>x.id===p.id)||{error:null};p.history.push({error:r.error,target:S.target})}S.screen='roundResult';S.resultsView='roundResult';S.resultPaused=false;S.autoRemaining=8;render();if(S.gamePace==='auto'&&!S.practice)startResultTimer()}
function advanceRound(hostInitiated=false){if(S.screen!=='roundResult'||(!hostInitiated&&S.me!==S.host))return;stopTimers();if(S.practice){startGame(hostInitiated);return}if(S.round===S.gameRounds){finishGame();return}S.round++;S.target=S.targets[S.round-1];startCountdown()}
function finishGame(){if(S.scored)return;S.scored=true;for(const p of active()){if(completed(p))p.total+=active().length-place(p)+1;p.allHistory.push(...p.history)}S.games++;S.live=false;screen('final')}
function pauseGame(migrate=false){if(!S.live)return;S.elapsed=Math.max(0,performance.now()-S.started);S.pausedFrom=S.screen;stopTimers();S.live=false;if(migrate&&S.host===S.me){const next=active().find(p=>p.id!==S.me);if(next)S.host=next.id}screen('paused')}
function resumeGame(){S.live=true;if(S.pausedFrom==='roundResult'){S.screen='roundResult';S.resultPaused=true;render()}else if(S.pausedFrom==='countdown')startCountdown();else startRound(true)}
function startRound(resuming=false){stopTimers();S.started=performance.now()-(resuming?S.elapsed:0);if(!resuming){S.results=[];S.locked=false}S.screen=S.locked?'waiting':'round';render();for(const p of active()){if(p.id===S.me||S.results.some(r=>r.id===p.id))continue;const error=Math.sin(S.round*7.1+p.id*3.7)*.82+(p.id%3)*.13;schedule(()=>record(p.id,error),Math.max(.15,S.target+error)*1000-(resuming?S.elapsed:0))}schedule(()=>{for(const p of active())if(!S.results.some(r=>r.id===p.id))S.results.push({id:p.id,error:null});S.locked=true;completeRound()},(S.target+8)*1000-(resuming?S.elapsed:0))}

function roundResult(){const error=S.results.find(x=>x.id===S.me)?.error??null,host=S.me===S.host,auto=S.gamePace==='auto'&&!S.practice;const meta=S.practice?t('noPracticePoints'):auto?(S.resultPaused?t('autoPaused'):t(S.round===S.gameRounds?'autoFinal':'autoNext',{n:S.autoRemaining})):t('roundPlace',{n:rank(active(),roundMetric,self()),total:active().length});const nextLabel=S.practice?t('start'):S.round===S.gameRounds?t('seeFinal'):t('nextRound');return shell(header(S.practice?t('practiceRound'):t('resultRound',{n:S.round}),'','menu'),`<div class="focal"><p class="meta">${t('yourTiming')}</p>${error===null?`<h2>${t('missed')}</h2>`:`<p class="number">${Math.abs(error).toFixed(2)} <small>s${error===0?'':' '+t(error<0?'early':'late')}</small></p>`}<p class="message">${winnersText(roundWinners(),true)}</p></div>${roster('roundResult')}`,footer(host?`<button class="button primary" data-action="nextRound">${nextLabel}</button>`:status('hostDecision',{name:people[S.host].name}),host&&auto?button(S.resultPaused?'resumeAuto':'pause','toggleAuto','secondary'):'',meta),'result-shell')}
function final(){const host=S.me===S.host,valid=active().filter(p=>completed(p)>0);return shell(header(t('final'),'','menu'),`<div class="focal"><h2>${valid.length?winnersText(winners(active(),gameMetric)):t('noCompletedTaps')}</h2><p class="message">${completed(self())?t('yourAverage',{n:mean(self()).toFixed(2)}):t('noMeasuredAverage')}</p></div>${roster('final')}`,footer(host?button('again','selectGame'):status('hostDecision',{name:people[S.host].name}),host?button('anotherGame','lobby','secondary'):'',completed(self())?t('yourPlace',{n:place(self())}):t('noGamePoints')))}
function detailsList(items){return `<dl class="detail-list">${items.map(([label,value])=>`<dt>${t(label)}</dt><dd>${value}</dd>`).join('')}</dl>`}
function pauseForReading(){if(S.screen==='roundResult'&&S.gamePace==='auto'&&!S.practice&&S.me===S.host&&!S.resultPaused){S.resultPaused=true;stopTimers();render()}}
function showRoundDetails(){pauseForReading();const error=S.results.find(x=>x.id===S.me)?.error??null;openDialog(t('roundDetails'),detailsList([['targetValue',S.target.toFixed(2)+' s'],['tapValue',error===null?'—':Math.max(0,S.target+error).toFixed(2)+' s'],['errorValue',errorText(error)],['place','#'+rank(active(),roundMetric,self())+' / '+active().length]]),button('close','dismiss'))}
function showOverall(){pauseForReading();openDialog(t('overallResults'),roster('overall'),button('close','dismiss'));dialog.classList.add('standings-dialog')}
function showStats(){const h=self().history.filter(r=>r.error!==null),best=h.length?Math.min(...h.map(r=>Math.abs(r.error))):null;openDialog(t('yourStats'),detailsList([['completedValue',completed(self())+' / '+S.gameRounds],['averageValue',h.length?mean(self()).toFixed(2)+' s':'—'],['bestValue',best===null?'—':best.toFixed(2)+' s'],['place','#'+place(self())]]),button('close','dismiss'))}
function menu(){pauseForReading();const mid=['countdown','round','waiting','roundResult'].includes(S.screen),host=S.me===S.host,inRoom=['lobby','catalogue'].includes(S.screen);openDialog(t(inRoom?'roomMenu':'gameMenu'),'',(S.screen==='roundResult'?button('roundDetails','roundDetails','secondary')+(!S.practice?button('overallResults','overallResults','secondary'):''):'')+(S.screen==='final'?button('yourStats','yourStats','secondary'):'')+(S.screen!=='catalogue'?button('help','help','secondary'):'')+(inRoom?button('inviteFriends','invite','secondary'):'')+(inRoom?button('roomPeople','roomPeople','secondary')+button('editIdentity','editIdentity','secondary')+button('roomPoints','roomPoints','secondary'):'')+(mid&&host?button('stop','stop','secondary'):'')+(inRoom&&host?button('manage','manage','secondary')+button('endEvening','endEvening','secondary'):'')+(inRoom?button('previewOptions',host?'previewSetup':'previewOptions','quiet'):'')+(mid?button('previewOptions','previewOptions','quiet'):'')+button('leave','leave','secondary'))}
function previewOptions(){if(S.screen==='catalogue'&&S.me!==S.host){openDialog(t('previewOptions'),'<p>'+t('previewSimulation')+'</p>',button('demoSelect','demoSelect','secondary')+button('previewSelectImpostor','previewSelectImpostor','secondary')+button('close','dismiss','quiet'));return}const room=['catalogue','lobby'].includes(S.screen);openDialog(t('previewOptions'),`<p class="meta">${t('previewExplanation')}</p>`,(room?(S.me!==S.host?button(S.screen==='catalogue'?'demoSelect':'demoStart',S.screen==='catalogue'?'demoSelect':'demoStart','secondary'):''):button('demoDisconnectLabel','demoDisconnect','secondary')+button('demoHostLabel','demoHost','secondary')+(S.screen==='roundResult'&&S.me!==S.host?button('demoNextLabel','demoNext','secondary'):''))+button('close','dismiss','quiet'))}
function help(){openDialog(t('help'),`<ol><li>${t('rules1')}</li><li>${t('rules2')}</li><li>${t('rules3')}</li><li>${t('rules4')}</li></ol><p class="meta">${t('rulesNote')}</p><p class="meta">${t('hiddenResult')}</p><p class="meta">${t('scoringNote')}</p>`,button('gotIt','dismiss'))}


let dialogTrail=[];
function dialogBack(){const parent=dialogTrail.pop();if(!parent){dismiss();return}dialog.innerHTML=parent.html;dialog.className=parent.classes;dialog.scrollTop=parent.scroll;if(parent.action)dialog.querySelector(`[data-action="${parent.action}"]`)?.focus({preventScroll:true})}
function commitSetup(){if(!['lobby','catalogue'].includes(S.screen)||S.me!==S.host||!S.setupDraft)return false;readSetup();const d=S.setupDraft;if(!Number.isInteger(d.rounds)||d.rounds<1||d.rounds>20||!Number.isInteger(d.players)||d.players<2||d.players>20){document.getElementById('setup-error').textContent=tr(document.getElementById('rounds-count')?'roundsInvalid':'setupValidation');return false}S.rounds=d.rounds;S.pace=d.pace;S.previewPlayers=d.players;people.forEach((p,i)=>{p.active=i<d.players;p.seen=p.active||p.total>0});document.getElementById('setup-error').textContent='';render();return true}
function chooseGame(){if(!['lobby','catalogue','final'].includes(S.screen)||(S.me!==S.host&&S.screen!=='lobby'))return;S.live=false;screen('catalogue')}
function editIdentity(){if(!['lobby','catalogue'].includes(S.screen))return;S.identityFace=self().face;openDialog(t('editIdentity'),`<div class="field"><label for="identity-name">${t('name')}</label><input id="identity-name" maxlength="12" value="${esc(self().name)}"></div><p class="setup-help">${t('roomIdentity')}</p><div class="face-gallery identity-gallery">${Array.from({length:25},(_,i)=>`<button type="button" data-action="identityFace" data-id="${i+1}" style="--tile:var(--${self().tile})" aria-label="${t('faceLabel',{n:i+1})}" aria-pressed="${self().face===i+1}">${avatar({face:i+1,tile:self().tile})}</button>`).join('')}</div><p id="identity-error" class="error" role="alert"></p>`,button('saveIdentity','saveIdentity'))}
function saveIdentity(){if(!['lobby','catalogue'].includes(S.screen))return;const name=document.getElementById('identity-name').value.trim();if(!name||name.length>12){document.getElementById('identity-error').textContent=tr('nameError');return}let unique=name,n=2;while(active().some(p=>p.id!==S.me&&p.name.toLowerCase()===unique.toLowerCase())){const suffix=' '+n++;unique=name.slice(0,12-suffix.length)+suffix}const other=active().find(p=>p.id!==S.me&&p.face===S.identityFace);if(other)other.face=self().face;self().name=unique;self().face=S.identityFace;S.name=unique;S.face=S.identityFace;dismiss();render()}
function roomPoints(){openDialog(t('roomPoints'),roster('summary'),button('close','dismiss'));dialog.classList.add('standings-dialog')}

const blindstopAction=action,blindstopMenu=menu,blindstopHelp=help;
action=async function(a,el={}){if(a==='nextClue'){advanceClue();return}if(a==='previewSpeaker'){advanceClue(true);return}if(a==='roleReminder'){showRoleReminder();return}if(a==='revealReminder'){revealReminder();return}
if(a==='categoriesStart'){startCategories();return}if(a==='previewCategoriesStart'){startCategories(true);return}if(a==='categoriesStop'){lockCategoryAnswers();return}if(a==='categoriesPreview'){openDialog(t('previewOptions'),`<p>${t('previewSimulation')}</p>`,button('categoriesPreviewAnswers','categoriesPreviewCommit')+button('close','dismiss','quiet'));return}if(a==='categoriesPreviewCommit'){dismiss();previewCategoryAnswers();return}if(a==='categoriesJudge'&&S.screen==='categoriesReview'&&S.me===S.host){const key=`${S.categories.reviewIndex}:${Number(el.dataset.id)}`;S.categories.judgments[key]=S.categories.judgments[key]===false;render();return}if(a==='categoriesConfirm'){confirmCategory();return}if(a==='replayCategories'){prepareGame('categories');return}
if(a==='categoriesPreviewSetup'){openDialog(t('previewOptions'),`<p>${t('previewSimulation')}</p>`,button('previewCategoriesStart','previewCategoriesStart')+button('close','dismiss','quiet'));return}if(a==='categoriesPreviewReview'){openDialog(t('previewOptions'),`<p>${t('previewSimulation')}</p>`,button('categoriesConfirmCategory','categoriesPreviewConfirm','secondary','',{category:tr(CATEGORY_KEYS[S.categories.reviewIndex])})+button('close','dismiss','quiet'));return}if(a==='categoriesPreviewConfirm'){dismiss();const me=S.me;S.me=S.host;confirmCategory();S.me=me;render();return}
if(a==='categoriesFinishEarly'&&S.screen==='categoriesWrite'&&S.me===S.host){openDialog(t('categoriesFinishTitle'),`<p>${t('categoriesFinishBody')}</p>`,button('categoriesFinishEarly','categoriesFinishConfirm')+button('cancel','dismiss','secondary'));return}if(a==='categoriesFinishConfirm'&&S.screen==='categoriesWrite'&&S.me===S.host){dismiss();lockCategoryAnswers(true);return}
if(a==='previewSelectCategories'&&S.screen==='catalogue'&&S.me!==S.host){S.gameId='categories';S.categories=null;screen('categoriesPrepare');return}
if(a==='chooseGame'&&S.gameId==='categories'&&S.screen.startsWith('categories')){S.live=false;S.categories=null;screen('catalogue');return}
if(a==='confirmLeave'&&S.gameId==='categories'&&S.screen.startsWith('categories')){S.returnScreen=S.screen;S.left=true;screen('return');return}if(a==='rejoin'&&S.gameId==='categories'&&S.returnScreen?.startsWith('categories')){S.left=false;screen(S.returnScreen);return}
if(a==='chooseGame'&&S.screen==='impostorPrepare'){S.impostor=null;screen('catalogue');return}
if(a==='impostorPreview'){openDialog(t('previewOptions'),'<p>'+t('previewSimulation')+'</p><p>'+t('previewRoleHelp')+'</p>',(S.screen==='catalogue'?button('previewSelectImpostor','previewSelectImpostor'):S.screen==='impostorPrepare'?button('previewDeal','previewDeal'):S.screen==='impostorClues'?button('previewSpeaker','previewSpeaker'):S.screen==='impostorDiscussion'?button('previewVoting','previewVoting'):S.screen==='impostorWaiting'?button('previewVotes','previewVotes'):S.screen==='impostorRole'?button('previewOrdinary','previewOrdinary','secondary')+button('previewImpostor','previewImpostor','secondary')+button('previewAssigned','previewAssigned','secondary'):'')+button('close','dismiss','quiet'));return}
if(a==='previewSelectImpostor'&&S.screen==='catalogue'&&S.me!==S.host){S.gameId='impostor';S.impostor=null;screen('impostorPrepare');return}
if(a==='previewDeal'&&S.screen==='impostorPrepare'){startImpostor(true);return}
if(a==='previewVoting'&&S.screen==='impostorDiscussion'){screen('impostorVote');return}
if(a==='previewVotes'){finishImpostorPreview();return}
if(a==='previewAssigned'&&S.screen==='impostorRole'){S.impostor.previewRole=null;S.impostor.revealed=false;screen('impostorRole');return}
if(a==='selectGame'){prepareGame(el.dataset?.id||'blindstop');return}if(a==='impostorStart'){startImpostor();return}if(a==='revealRole'&&S.screen==='impostorRole'){S.impostor.revealed=true;render();return}if(a==='hideRole'&&S.screen==='impostorRole'&&S.impostor.revealed){S.impostor.revealed=false;S.impostor.previewRole=null;screen('impostorClues');return}if(a==='openVote'&&S.screen==='impostorDiscussion'&&S.me===S.host){screen('impostorVote');return}if(a==='chooseSuspect'&&S.screen==='impostorVote'){const id=Number(el.dataset.id);if(id!==S.me&&active().some(p=>p.id===id)){S.impostor.vote=id;render()}return}if(a==='confirmVote'&&S.screen==='impostorVote'&&S.impostor.vote!==null){const p=people[S.impostor.vote];openDialog(t('confirmVoteTitle'),`<p>${t('confirmVoteBody',{name:p.name})}</p>`,button('confirmVote','castImpostorVote')+button('cancel','dismiss','secondary'));return}if(a==='castImpostorVote'){castImpostorVote();return}if(a==='replayImpostor'){prepareGame('impostor');return}if(['previewOrdinary','previewImpostor'].includes(a)&&S.impostor){S.impostor.previewRole=a==='previewImpostor'?'impostor':'ordinary';S.impostor.revealed=true;dismiss();screen('impostorRole');return}if(a==='confirmLeave'&&S.gameId==='impostor'&&S.screen.startsWith('impostor')){S.returnScreen=S.screen;if(S.impostor){S.impostor.revealed=false;S.impostor.previewRole=null}S.left=true;screen('return');return}if(a==='rejoin'&&S.gameId==='impostor'&&S.returnScreen?.startsWith('impostor')){S.left=false;screen(S.returnScreen);return}return blindstopAction(a,el)};
menu=function(){if(S.gameId==='categories'&&S.screen.startsWith('categories')){const host=S.me===S.host;openDialog(t('categoriesMenu'),'',button('categoriesRules','help','secondary')+(host&&S.screen==='categoriesWrite'?button('categoriesFinishEarly','categoriesFinishEarly','secondary'):'')+(!host&&S.screen==='categoriesPrepare'?button('previewOptions','categoriesPreviewSetup','quiet'):'')+button('leave','leave','secondary'));return}if(S.gameId!=='impostor'||!S.screen.startsWith('impostor'))return blindstopMenu();const host=S.me===S.host;openDialog(t('impostorMenu'),'',button('impostorRules','help','secondary')+(['impostorRole','impostorWaiting'].includes(S.screen)||(!host&&['impostorPrepare','impostorClues','impostorDiscussion'].includes(S.screen))?button('previewOptions','impostorPreview','quiet'):'')+(host&&!['impostorPrepare','impostorResult'].includes(S.screen)?button('stop','stop','secondary'):'')+button('leave','leave','secondary'))};
help=function(){if(S.gameId==='categories'){openDialog(t('categoriesRules'),`<ol><li>${t('categoriesRule1')}</li><li>${t('categoriesRule2')}</li><li>${t('categoriesRule3')}</li><li>${t('categoriesRule4')}</li></ol>`,button('gotIt','dismiss'));return}if(S.gameId!=='impostor')return blindstopHelp();openDialog(t('impostorRules'),`<ol><li>${t('impostorRule1')}</li><li>${t('impostorRule2')}</li><li>${t('impostorRule3')}</li><li>${t('impostorRule4')}</li></ol><p class="meta">${t('impostorNoPoints')}</p>`,button('gotIt','dismiss'))};

app.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el&&!el.disabled)action(el.dataset.action,el)});dialog.addEventListener('click',event=>{const el=event.target.closest('[data-action]');if(el)action(el.dataset.action,el)});
app.addEventListener('change',event=>{if(event.target.id==='prepare-rounds')updatePreparation()});
app.addEventListener('input',event=>{if(event.target.id==='code')event.target.value=event.target.value.toUpperCase().replace(/\s/g,'');if(event.target.dataset?.categoryIndex!==undefined&&S.screen==='categoriesWrite'){S.categories.draft[Number(event.target.dataset.categoryIndex)]=event.target.value;const stop=app.querySelector('[data-action="categoriesStop"]');if(stop)stop.disabled=!S.categories.draft.every(value=>value.trim())}});
app.addEventListener('submit',event=>{event.preventDefault();remember();const data=new FormData(event.target),name=String(data.get('name')||'').trim(),code=String(data.get('code')||'').trim().toUpperCase();let error='';if(!name||name.length>12)error='nameError';else if(S.mode==='join'&&code.length!==5)error='codeError';else if(S.mode==='join'&&!/^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{5}$/.test(code))error='badAlphabet';if(error){document.getElementById('form-error').textContent=tr(error);document.getElementById(error==='nameError'?'name':'code')?.focus();return}if(S.mode==='join'&&code!=='K7QMX'){screen('gone');return}let finalName=name,n=2;while(active().some(p=>p.id!==S.me&&p.name.toLowerCase()===finalName.toLowerCase())){const suffix=' '+n++;finalName=name.slice(0,12-suffix.length)+suffix}S.name=name;self().name=finalName;const previousFace=self().face;const sameFace=active().find(p=>p.id!==S.me&&p.face===S.face);if(sameFace)sameFace.face=previousFace;self().face=S.face;S.live=false;S.left=false;screen('catalogue');});
// Pointer presses measure the intention at contact, not after finger release.
app.addEventListener('pointerdown',event=>{if(event.button!==0)return;const el=event.target.closest('[data-action="tap"]');if(el&&!el.disabled){event.preventDefault();tap()}});
app.addEventListener('keydown',event=>{if(event.repeat)return;if(event.target?.dataset?.action==='tap'&&[' ','Enter'].includes(event.key)){event.preventDefault();tap()}});
dialog.addEventListener('cancel',event=>{event.preventDefault();dialogBack()});
dialog.addEventListener('change',event=>{if(['rounds-count','preview-people'].includes(event.target.id))commitSetup()});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&reminderOpen)dismiss();if(document.hidden&&S.screen==='impostorRole'&&S.impostor?.revealed){S.impostor.revealed=false;render()}if(document.hidden&&S.live)pauseGame(false)});window.addEventListener('pagehide',stopTimers);
// Resize the layout without replacing focused inputs or their drafts.
if(window.visualViewport){const syncCategoryViewport=()=>app.style.setProperty('--category-viewport-height',window.visualViewport.height+'px');window.visualViewport.addEventListener('resize',syncCategoryViewport);syncCategoryViewport()}
const initial=new URLSearchParams(location.hash.slice(1));if(initial.get('join')){S.mode='join';S.me=1;S.draftCode='K7QMX';S.screen='qrjoin'}render();
</script></body></html>
